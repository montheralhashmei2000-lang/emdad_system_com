# التكامل المستمر لتطبيق Flutter (M_com/imdad_flutter):
# pub get ← توليد كود Drift ← التحليل الساكن ← الاختبارات.
# يعمل عند الدفع إلى main وعند أي طلب دمج إليه، ويمسّ هذا المجلد وحده.
name: CI

on:
  push:
    branches: [main]
    paths:
      - "M_com/imdad_flutter/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "M_com/imdad_flutter/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # الاختبارات تشمل اشتقاق PBKDF2 بـ 310 ألف دورة في وضع debug فتطول.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: M_com/imdad_flutter
    steps:
      - uses: actions/checkout@v4

      # الاختبارات تفتح قواعد SQLite في الذاكرة عبر مكتبة النظام.
      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      # ملفات *.g.dart لا تُرفع إلى المستودع؛ تُولَّد هنا كما على جهاز المطوّر.
      - name: build_runner (Drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test
