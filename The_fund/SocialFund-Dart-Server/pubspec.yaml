name: social_fund_dart_server
description: خادم Dart (Shelf + Drift/SQLite) لنظام الصندوق الاجتماعي التنموي.
version: 2.0.0
publish_to: 'none'

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  # طبقة HTTP
  shelf: ^1.4.1
  shelf_router: ^1.1.0
  shelf_static: ^1.1.3

  # قاعدة البيانات (SQLite عبر Drift)
  drift: ^2.20.0
  sqlite3: ^2.4.0
  path: ^1.9.0

  # تشفير ومصادقة
  crypto: ^3.0.5
  jose: ^0.3.4

  # أدوات
  uuid: ^4.5.1
  pdf: ^3.11.1
  mime: ^2.0.0
  intl: ^0.20.0
  cryptography: ^2.9.0
  excel: ^4.0.6

dev_dependencies:
  test: ^1.25.0
  lints: ^4.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.10


